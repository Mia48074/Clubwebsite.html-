<h1 class="header" >Membership Requirements:</h1>
<h2 class="description" style="text-align: center">No experience required! Just be ready to create!</h2>
<form>
  <label for="name">Name:</label><br>
  <input type="text" id="name" name="name"><br>
  <label for="email">Email:</label><br>
  <input type="email" id="email" name="email"><br>
  <label for="phone">Phone Number:</label><br>
  <input type="tel" id="phone" name="phone"><br>
  <label for="experience">Experience Level:</label><br>
  <select id="experience" name="experience">
    <option value="beginner">Beginner</option>
    <option value="intermediate">Intermediate</option>
    <option value="advanced">Advanced</option>
  </select><br>
  <label for="interests">Interests:</label><br>
  <textarea id="interests" name="interests" rows="4" cols="50"></textarea><br>
  <label for="availability">Availability:</label><br>
  <input type="text" id="availability" name="availability"><br>
</form>
<button type="button">Join!</button>
